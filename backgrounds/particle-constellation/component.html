<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Particle Constellation</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
}
.canvas-wrap{
  position:relative;width:260px;height:180px;border-radius:20px;
  overflow:hidden;background:#090A0F;border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 12px 36px rgba(0,0,0,0.5);
}
canvas{display:block;width:100%;height:100%}
.overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(circle at center, transparent 30%, rgba(9,10,15,0.85) 90%);
}
.badge{
  font-family:sans-serif;font-size:11px;font-weight:600;letter-spacing:1px;
  color:#93C5FD;padding:4px 10px;background:rgba(59,130,246,0.15);
  border-radius:20px;border:1px solid rgba(147,197,253,0.3);text-transform:uppercase;
}
</style>
</head>
<body>
<div class="canvas-wrap">
  <canvas id="cvs"></canvas>
  <div class="overlay">
    <div class="badge">Ambient Constellation</div>
  </div>
</div>
<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let w, h;
function resize(){
  w = cvs.width = cvs.parentElement.clientWidth;
  h = cvs.height = cvs.parentElement.clientHeight;
}
resize();

const particles = Array.from({length: 34}, () => ({
  x: Math.random() * w,
  y: Math.random() * h,
  vx: (Math.random() - 0.5) * 0.7,
  vy: (Math.random() - 0.5) * 0.7,
  r: Math.random() * 1.5 + 1
}));

function draw(){
  ctx.clearRect(0, 0, w, h);
  for(let i=0; i<particles.length; i++){
    let p = particles[i];
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0 || p.x > w) p.vx *= -1;
    if(p.y < 0 || p.y > h) p.vy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = '#60A5FA';
    ctx.fill();

    for(let j=i+1; j<particles.length; j++){
      let p2 = particles[j];
      let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
      if(dist < 55){
        ctx.strokeStyle = `rgba(96,165,250,${(1 - dist/55) * 0.35})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
