<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Dynamic Wave Grid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
}
.card{
  width:260px;height:180px;border-radius:20px;background:#0F172A;
  border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;
  justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,0.5);overflow:hidden;
}
.grid{
  display:grid;grid-template-columns:repeat(7, 1fr);gap:12px;
}
.dot{
  width:8px;height:8px;border-radius:50%;background:#38BDF8;
  animation:dotWave 2s ease-in-out infinite;
}
@keyframes dotWave{
  0%,100%{transform:scale(0.5);opacity:0.2;background:#38BDF8}
  50%{transform:scale(1.4);opacity:1;background:#818CF8;box-shadow:0 0 10px #818CF8}
}
</style>
</head>
<body>
<div class="card">
  <div class="grid" id="dotGrid"></div>
</div>
<script>
const grid = document.getElementById('dotGrid');
for(let row=0; row<5; row++){
  for(let col=0; col<7; col++){
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.animationDelay = `${(row + col) * 0.12}s`;
    grid.appendChild(d);
  }
}
</script>
</body>
</html>
