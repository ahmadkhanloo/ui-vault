<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Synthwave Grid Horizon</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
}
.grid-box{
  position:relative;width:260px;height:180px;border-radius:20px;
  overflow:hidden;background:#0D0517;border:1px solid rgba(236,72,153,0.2);
  perspective:160px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 36px rgba(0,0,0,0.6);
}
.sun{
  position:absolute;top:22px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(180deg, #FDE047 0%, #EC4899 75%);
  box-shadow:0 0 25px rgba(236,72,153,0.7);z-index:1;
}
.horizon{
  position:absolute;bottom:0;width:100%;height:65%;
  transform:rotateX(60deg);transform-origin:bottom center;
  background-image:
    linear-gradient(rgba(236,72,153,0.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(236,72,153,0.5) 1px, transparent 1px);
  background-size:24px 24px;
  animation:fly 1.2s linear infinite;
  mask-image:linear-gradient(to top, rgba(0,0,0,1) 30%, transparent 100%);
  -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,1) 30%, transparent 100%);
}
@keyframes fly{
  0%{background-position:0 0}
  100%{background-position:0 24px}
}
</style>
</head>
<body>
<div class="grid-box">
  <div class="sun"></div>
  <div class="horizon"></div>
</div>
</body>
</html>
