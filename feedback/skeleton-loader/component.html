<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Shimmering Skeleton Loader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
}
.card{
  width:260px;padding:16px;background:#141519;border-radius:18px;
  border:1px solid rgba(255,255,255,0.08);box-shadow:0 10px 30px rgba(0,0,0,0.5);
  display:flex;flex-direction:column;gap:12px;
}
.top{
  display:flex;gap:12px;align-items:center;
}
.sk{
  background:#20222A;position:relative;overflow:hidden;border-radius:6px;
}
.sk::after{
  content:'';position:absolute;inset:0;
  transform:translateX(-100%);
  background:linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
  animation:shimmer 1.5s infinite;
}
.avatar{width:38px;height:38px;border-radius:50%}
.meta{flex:1;display:flex;flex-direction:column;gap:6px}
.line-sm{height:10px;width:60%}
.line-xs{height:8px;width:40%}
.banner{height:54px;border-radius:10px}
@keyframes shimmer{
  100%{transform:translateX(100%)}
}
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div class="sk avatar"></div>
    <div class="meta">
      <div class="sk line-sm"></div>
      <div class="sk line-xs"></div>
    </div>
  </div>
  <div class="sk banner"></div>
</div>
</body>
</html>
