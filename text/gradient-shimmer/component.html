<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Shimmer Gradient Text</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.card{
  width:260px;height:140px;background:#141416;border-radius:20px;
  border:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(0,0,0,0.5);
  padding:20px;text-align:center;
}
.shimmer{
  font-size:24px;font-weight:800;letter-spacing:-0.5px;
  background:linear-gradient(90deg, #94A3B8 0%, #FFFFFF 30%, #38BDF8 50%, #A855F7 70%, #94A3B8 100%);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 3s linear infinite;
}
.sub{
  margin-top:6px;font-size:11px;color:#64748B;font-weight:500;
}
@keyframes shine{
  to{background-position:200% center}
}
</style>
</head>
<body>
<div class="card">
  <div class="shimmer">Next Horizon</div>
  <div class="sub">Dynamic fluid gradient illumination</div>
</div>
</body>
</html>
