<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Staggered Character Wave</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:Inter,sans-serif;
}
.wrapper{
  width:260px;height:130px;background:#121316;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.08);box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.title{
  display:flex;gap:1.5px;font-size:20px;font-weight:700;letter-spacing:-0.3px;color:#FFF;
}
.char{
  display:inline-block;animation:wave 1.6s ease-in-out infinite;
}
.subtitle{
  font-size:11px;color:#71717A;margin-top:8px;font-weight:500;
}
@keyframes wave{
  0%,100%{transform:translateY(0) scale(1);color:#FFF}
  40%{transform:translateY(-8px) scale(1.15);color:#60A5FA}
  60%{transform:translateY(2px) scale(0.96);color:#A78BFA}
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="title" id="waveText"></div>
  <div class="subtitle">Continuous micro-interaction wave</div>
</div>
<script>
const text = "INTERACTIVE MOTION";
const container = document.getElementById('waveText');
text.split('').forEach((c, i) => {
  const span = document.createElement('span');
  span.className = 'char';
  span.textContent = c === ' ' ? '\u00A0' : c;
  span.style.animationDelay = `${i * 0.07}s`;
  container.appendChild(span);
});
</script>
</body>
</html>
