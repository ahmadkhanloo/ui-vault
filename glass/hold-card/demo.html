<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Glass — کارت شیشه‌ای (Hold)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../glass.css">
<style>
  .stage { --ink:#F1F5F9; --ink-soft:#94A3B8; background: #0B0D13; }

  /* Colour behind the card: its rim pulls this towards the centre, and the face frosts it. */
  .cluster { position: absolute; inset: 0; display: grid; place-items: center; }
  .cluster .blob.a { width: 200px; height: 200px; transform: translate(-112px, -52px); background: #ff5a4d; }
  .cluster .blob.b { width: 178px; height: 178px; transform: translate(104px, 4px); background: #2f6bff; }
  .cluster .blob.c { width: 128px; height: 128px; transform: translate(26px, 92px); background: #22c9a4; }
  .cluster .panel { width: 132px; height: 132px; transform: translate(-72px, 86px); background: #ffd76e; border-radius: 34px; }

  /* ── GlassCard: the look before the glass draws ──
     rounded-[28px], border-white/60, bg-white at --glass-card-tint, frost at --glass-card-blur */
  .card {
    position: relative;
    width: 244px;
    padding: 18px 20px 20px;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(18, 22, 30, 0.75);
    color: #F1F5F9;
    --glass-card-tint: 70%;
    --glass-card-blur: 5px;
    backdrop-filter: blur(var(--glass-card-blur));
    -webkit-backdrop-filter: blur(var(--glass-card-blur));
  }
  /* The drop shadow lives under the glass: an outer box-shadow never paints inside its box. */
  .card .shadow {
    position: absolute; inset: 0; border-radius: inherit; z-index: -2;
    box-shadow: 0 16.5px 36px rgba(0, 0, 0, 0.08), 0 26.4px 55.9px rgba(0, 0, 0, 0.08);
    pointer-events: none;
  }
  [data-glass-tone="dark"] { color: #fff; }

  .card h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .card p { margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #4a5158; }
  [data-glass-tone="dark"] p { color: rgba(255, 255, 255, 0.75); }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .ring {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    font: 650 11px/1 var(--font); color: #F1F5F9;
    background: #ffd76e;
  }
  .bars { flex: 1; display: grid; gap: 6px; }
  .bars i { display: block; height: 5px; border-radius: 999px; background: #16181a; opacity: 0.16; }
  .bars i:last-child { width: 62%; }

  .caption { inset: auto 0 10px 0; font-size: 10.5px; }
</style>
</head>
<body>
<div class="stage">
  <div class="cluster" aria-hidden="true">
    <div class="blob a"></div>
    <div class="blob b"></div>
    <div class="blob c"></div>
    <div class="panel"></div>
  </div>

  <div class="card" data-glass-host>
    <span class="shadow" aria-hidden="true"></span>
    <h2 dir="ltr">Weekly report</h2>
    <p dir="ltr">Frosted glass keeps the text readable over anything that slides behind.</p>
    <div class="row">
      <span class="ring">7.4</span>
      <span class="bars" aria-hidden="true"><i></i><i></i></span>
    </div>
  </div>

  <p class="caption">شیشهٔ کارت زیر اشاره‌گر ساکن است؛ محتوا را نگه می‌دارد</p>
</div>

<script src="../liquid-glass.js"></script>
<script>
  LiquidGlass.injectStyles();

  // GlassCard (hold): swell is off — a card holds content, it is not a button.
  // Its own optics: a radial bend at the rim, a 5px frost, a 70% tint and a 1.3px white line.
  const card = document.querySelector('.card');
  LiquidGlass.layerFor(card, {
    material: 'clear',
    tint: 0.7,
    blur: 5,
    swell: false,
    optics: {
      bendMode: 'radial',
      borderColor: '#ffffff',
      borderAlpha: 0.6,
      borderWidth: 1.3,
      frostMix: 1,
      frostEdge: 1,
      saturation: 1,
      refraction: 1,
      bendDepth: 1.35,
      bendCurve: 9.75,
      dispersion: 0,
      magnify: 0,
      light: 0,
      cursorLight: false,
      shadow: 0,
    },
  });
</script>
</body>
</html>
