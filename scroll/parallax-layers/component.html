<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Simulated Parallax Scroll</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:Inter,sans-serif;
}
.window{
  width:260px;height:180px;background:#0F1015;border-radius:18px;
  border:1px solid rgba(255,255,255,0.08);overflow:hidden;position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.layer{
  position:absolute;width:100%;display:flex;flex-direction:column;gap:10px;padding:14px;
}
.layer-bg{
  animation:scrollSlow 4s ease-in-out infinite alternate;
}
.layer-fg{
  animation:scrollFast 4s ease-in-out infinite alternate;
}
.card-bg{
  height:36px;background:rgba(255,255,255,0.04);border-radius:8px;
  border:1px dashed rgba(255,255,255,0.1);
}
.card-fg{
  height:44px;background:#1F2430;border-radius:10px;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);
  display:flex;align-items:center;padding:0 12px;font-size:12px;color:#93C5FD;
}
@keyframes scrollSlow{
  0%{transform:translateY(0)}
  100%{transform:translateY(-24px)}
}
@keyframes scrollFast{
  0%{transform:translateY(0)}
  100%{transform:translateY(-60px)}
}
</style>
</head>
<body>
<div class="window">
  <div class="layer layer-bg">
    <div class="card-bg"></div>
    <div class="card-bg"></div>
    <div class="card-bg"></div>
    <div class="card-bg"></div>
  </div>
  <div class="layer layer-fg">
    <div class="card-fg">Parallax Layer 01</div>
    <div class="card-fg">Deep Motion Velocity</div>
    <div class="card-fg">Multi-plane Relative Shift</div>
  </div>
</div>
</body>
</html>
