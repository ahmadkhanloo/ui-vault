<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Scroll-Driven Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:Inter,sans-serif;
}
.container{
  width:260px;height:170px;background:#14161D;border-radius:18px;
  border:1px solid rgba(255,255,255,0.08);padding:14px;overflow:hidden;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,0.5);
  position:relative;
}
.scroll-track{
  display:flex;flex-direction:column;gap:8px;
  animation:trackMove 4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.item{
  padding:10px 14px;background:#1E222D;border-radius:10px;font-size:12px;
  color:#E2E8F0;border:1px solid rgba(255,255,255,0.05);
  transition:all 0.3s ease;
}
@keyframes trackMove{
  0%,15%{transform:translateY(0)}
  40%,60%{transform:translateY(-56px)}
  85%,100%{transform:translateY(-112px)}
}
</style>
</head>
<body>
<div class="container">
  <div class="scroll-track">
    <div class="item">01. Sticky Header Pin</div>
    <div class="item">02. Progressive Scroll Zoom</div>
    <div class="item">03. Horizontal Viewport Track</div>
    <div class="item">04. Inertial Rubber Band</div>
  </div>
</div>
</body>
</html>
