<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Shadcn Floating Dropdown Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;color:#FFF;
}
.menu-box{
  width:220px;background:#111318;border-radius:14px;border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 14px 36px rgba(0,0,0,0.6);padding:6px;display:flex;flex-direction:column;gap:2px;
}
.menu-label{
  font-size:10px;font-weight:600;color:#64748B;padding:6px 8px;text-transform:uppercase;letter-spacing:0.5px;
}
.menu-item{
  display:flex;align-items:center;justify-content:space-between;padding:7px 10px;
  border-radius:8px;font-size:11.5px;color:#E2E8F0;cursor:pointer;transition:background 0.15s;
}
.menu-item:hover{
  background:rgba(56,189,248,0.12);color:#38BDF8;
}
.menu-item svg{color:#94A3B8;flex-shrink:0}
.menu-item:hover svg{color:#38BDF8}
.item-left{display:flex;align-items:center;gap:8px}
.shortcut{font-size:10px;color:#64748B;font-family:monospace}
.divider{height:1px;background:rgba(255,255,255,0.06);margin:4px 0}
.danger{color:#F87171}
.danger:hover{background:rgba(248,113,113,0.12);color:#F87171}
</style>
</head>
<body>
<div class="menu-box">
  <div class="menu-label">Workspace Settings</div>
  <div class="menu-item">
    <div class="item-left">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Collaborators</span>
    </div>
    <span class="shortcut">⌘P</span>
  </div>
  <div class="menu-item">
    <div class="item-left">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Preferences</span>
    </div>
    <span class="shortcut">⌘,</span>
  </div>
  <div class="divider"></div>
  <div class="menu-item danger">
    <div class="item-left">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      <span>Disconnect</span>
    </div>
  </div>
</div>
</body>
</html>
