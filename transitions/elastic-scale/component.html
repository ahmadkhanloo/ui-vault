<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Elastic Morph Scale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
}
.morph-box{
  width:260px;height:160px;background:#111216;border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;
  justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.shape{
  width:64px;height:64px;background:linear-gradient(135deg, #3B82F6, #8B5CF6);
  border-radius:18px;animation:elastic 2.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  box-shadow:0 0 25px rgba(99,102,241,0.4);
}
@keyframes elastic{
  0%,100%{transform:scale(1) rotate(0deg);border-radius:18px}
  30%{transform:scale(1.25, 0.8) rotate(45deg);border-radius:50%}
  60%{transform:scale(0.85, 1.25) rotate(90deg);border-radius:12px}
  80%{transform:scale(1.05) rotate(135deg);border-radius:26px}
}
</style>
</head>
<body>
<div class="morph-box">
  <div class="shape"></div>
</div>
</body>
</html>
