<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Flip View Transition</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:Inter,sans-serif;perspective:600px;
}
.card{
  width:240px;height:140px;position:relative;
  transform-style:preserve-3d;
  animation:flip 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
.face{
  position:absolute;inset:0;border-radius:18px;padding:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 12px 30px rgba(0,0,0,0.5);text-align:center;
}
.front{background:#18181B;color:#FAFAFA}
.back{background:#1E1B4B;color:#C7D2FE;transform:rotateY(180deg)}
.title{font-size:15px;font-weight:600}
.sub{font-size:11px;opacity:0.6;margin-top:6px}
@keyframes flip{
  0%,40%{transform:rotateY(0deg)}
  50%,90%{transform:rotateY(180deg)}
  100%{transform:rotateY(360deg)}
}
</style>
</head>
<body>
<div class="card">
  <div class="face front">
    <div class="title">Active Viewport</div>
    <div class="sub">State A &bull; Production Mode</div>
  </div>
  <div class="face back">
    <div class="title">Transitioned View</div>
    <div class="sub">State B &bull; Live Telemetry</div>
  </div>
</div>
</body>
</html>
