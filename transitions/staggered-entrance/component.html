<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Staggered List Entrance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:Inter,sans-serif;
}
.box{
  width:260px;padding:16px;background:#131418;border-radius:18px;
  border:1px solid rgba(255,255,255,0.08);box-shadow:0 10px 30px rgba(0,0,0,0.5);
  display:flex;flex-direction:column;gap:8px;
}
.item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  background:#1C1D24;border-radius:10px;font-size:12px;color:#F3F4F6;
  opacity:0;transform:translateY(18px);
  animation:enter 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
}
.icon{
  width:20px;height:20px;border-radius:6px;background:rgba(59,130,246,0.2);
  color:#60A5FA;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
}
.item:nth-child(1){animation-delay:0.1s}
.item:nth-child(2){animation-delay:0.25s}
.item:nth-child(3){animation-delay:0.4s}
@keyframes enter{
  0%{opacity:0;transform:translateY(18px)}
  15%,80%{opacity:1;transform:translateY(0)}
  95%,100%{opacity:0;transform:translateY(-14px)}
}
</style>
</head>
<body>
<div class="box">
  <div class="item"><div class="icon">01</div><span>Deployment initialized</span></div>
  <div class="item"><div class="icon">02</div><span>Assets optimized & bundled</span></div>
  <div class="item"><div class="icon">03</div><span>CDN edge cache cleared</span></div>
</div>
</body>
</html>
