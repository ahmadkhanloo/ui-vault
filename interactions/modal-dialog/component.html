<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Interactive Modal Dialog</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;color:#FFF;
}
.dialog-card{
  width:260px;background:#141720;border-radius:18px;border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 16px 40px rgba(0,0,0,0.6);padding:18px;display:flex;flex-direction:column;gap:12px;
  position:relative;animation:modalEnter 3s ease-in-out infinite alternate;
}
.header{display:flex;justify-content:space-between;align-items:flex-start}
.title{font-size:14px;font-weight:700}
.close-btn{
  width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,0.06);
  border:none;color:#94A3B8;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.desc{font-size:11px;color:#94A3B8;line-height:1.4}
.input-row{display:flex;flex-direction:column;gap:4px}
.label{font-size:10px;font-weight:600;color:#CBD5E1}
.input{
  padding:6px 10px;background:#0F1116;border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;color:#FFF;font-size:11px;outline:none;
}
.footer{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn{
  padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:none;
}
.btn-cancel{background:rgba(255,255,255,0.06);color:#94A3B8}
.btn-primary{background:#38BDF8;color:#090A0D}
@keyframes modalEnter{
  0%{transform:scale(0.96) translateY(2px);box-shadow:0 10px 24px rgba(0,0,0,0.4)}
  100%{transform:scale(1) translateY(-2px);box-shadow:0 18px 44px rgba(56,189,248,0.18)}
}
</style>
</head>
<body>
<div class="dialog-card">
  <div class="header">
    <div>
      <div class="title">Edit Deployment</div>
      <div class="desc">Configure active edge runtime parameters.</div>
    </div>
    <button class="close-btn">&times;</button>
  </div>
  <div class="input-row">
    <span class="label">Subdomain</span>
    <input type="text" class="input" value="api.vault-edge.dev">
  </div>
  <div class="footer">
    <button class="btn btn-cancel">Cancel</button>
    <button class="btn btn-primary">Save changes</button>
  </div>
</div>
</body>
</html>
