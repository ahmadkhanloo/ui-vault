<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Modern Glass Auth Card</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;color:#FFF;
}
.card{
  width:260px;padding:22px 18px;background:rgba(20,22,28,0.85);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:20px;border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 14px 38px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:12px;
}
.header{text-align:center}
.title{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.sub{font-size:11px;color:#94A3B8;margin-top:2px}
.oauth-btn{
  width:100%;padding:8px;border-radius:10px;background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);color:#F1F5F9;font-size:11px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background 0.2s,transform 0.15s;
}
.oauth-btn:hover{background:rgba(255,255,255,0.12);transform:translateY(-1px)}
.divider{
  display:flex;align-items:center;gap:8px;font-size:9px;color:#64748B;text-transform:uppercase;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08)}
.input-wrap{position:relative}
.input-box{
  width:100%;padding:8px 12px;background:rgba(15,17,23,0.7);border-radius:10px;
  border:1px solid rgba(255,255,255,0.1);color:#FFF;font-size:11px;outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.input-box:focus{
  border-color:#38BDF8;box-shadow:0 0 12px rgba(56,189,248,0.25);
}
.submit-btn{
  width:100%;padding:9px;border-radius:10px;border:none;
  background:linear-gradient(135deg, #2563EB, #38BDF8);color:#FFF;
  font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 4px 15px rgba(37,99,235,0.35);
  transition:filter 0.2s,transform 0.15s;
}
.submit-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title">Welcome Back</div>
    <div class="sub">Enter your credentials</div>
  </div>
  <button class="oauth-btn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
    Continue with GitHub
  </button>
  <div class="divider">or email</div>
  <div class="input-wrap">
    <input type="text" class="input-box" placeholder="name@company.com" value="alex@developer.io">
  </div>
  <button class="submit-btn">Sign in to Console</button>
</div>
</body>
</html>
