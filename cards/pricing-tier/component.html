<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>SaaS Pricing Tier Card</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:100%;height:100vh;overflow:hidden;background:transparent!important;
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;color:#FFF;
}
.pricing-card{
  width:260px;padding:20px 18px;background:#12141A;border-radius:20px;
  border:1px solid rgba(59,130,246,0.4);position:relative;
  box-shadow:0 14px 40px rgba(0,0,0,0.6);display:flex;flex-direction:column;gap:12px;
}
.badge{
  position:absolute;top:-10px;right:18px;background:linear-gradient(90deg, #3B82F6, #8B5CF6);
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;
  padding:3px 10px;border-radius:20px;box-shadow:0 4px 12px rgba(59,130,246,0.4);
}
.tier-name{font-size:15px;font-weight:700;color:#F1F5F9}
.price-row{display:flex;align-items:baseline;gap:4px}
.amount{font-size:26px;font-weight:800;color:#FFF}
.period{font-size:11px;color:#94A3B8}
.features{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.feat{display:flex;align-items:center;gap:8px;font-size:11px;color:#CBD5E1}
.feat svg{color:#38BDF8;flex-shrink:0}
.cta-btn{
  width:100%;padding:9px;border-radius:10px;border:none;
  background:#3B82F6;color:#FFF;font-size:12px;font-weight:600;
  cursor:pointer;margin-top:4px;box-shadow:0 4px 15px rgba(59,130,246,0.3);
  transition:all 0.2s;
}
.cta-btn:hover{background:#2563EB;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="pricing-card">
  <div class="badge">Most Popular</div>
  <div class="tier-name">Pro Workspace</div>
  <div class="price-row">
    <span class="amount">$29</span>
    <span class="period">/ month &bull; billed annually</span>
  </div>
  <div class="features">
    <div class="feat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Unlimited agent worktrees</span>
    </div>
    <div class="feat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Full motion graphic exports</span>
    </div>
    <div class="feat">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Team cloud synchronization</span>
    </div>
  </div>
  <button class="cta-btn">Start 14-day Trial</button>
</div>
</body>
</html>
