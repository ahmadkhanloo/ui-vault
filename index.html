<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>گنجینهٔ UI — ui-vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090A0D;
  --surface:#111318;
  --surface-2:#161922;
  --surface-hover:#1D212D;
  --fg:#F1F4F9;
  --muted:#94A3B8;
  --faint:#64748B;
  --border:rgba(255,255,255,0.07);
  --border-strong:rgba(255,255,255,0.16);
  --accent:#38BDF8;
  --accent-glow:rgba(56,189,248,0.22);
  --font-body:"Vazirmatn","Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --radius:16px;
  --maxw:1320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-body);font-size:14px;line-height:1.6;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}

/* ---------- هدر چسبان هوشمند با ساختار استاندارد ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(9,10,13,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.head-inner{
  max-width:var(--maxw);margin:0 auto;
  padding:14px 24px;display:flex;flex-direction:column;gap:12px;
}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg, #38BDF8, #818CF8);
  display:flex;align-items:center;justify-content:center;
  color:#090A0D;font-weight:800;font-size:14px;box-shadow:0 0 16px rgba(56,189,248,0.35);
}
.title-group{display:flex;align-items:baseline;gap:8px}
h1{
  font-size:18px;font-weight:800;letter-spacing:-0.3px;
  display:flex;align-items:center;gap:8px;
}
.current-group-badge{
  font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--accent);
  background:rgba(56,189,248,0.1);padding:3px 12px;border-radius:20px;
  border:1px solid rgba(56,189,248,0.22);display:inline-block;transition:all 0.2s;
}

/* سرچ‌بار در سمت چپ هدر روبروی عنوان */
.search-box{
  position:relative;display:flex;align-items:center;width:280px;
}
.search-icon{
  position:absolute;right:12px;color:var(--faint);pointer-events:none;
}
.search-input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:8px 34px 8px 46px;
  font-family:var(--font-body);font-size:12.5px;color:var(--fg);
  outline:none;transition:all 0.2s;
}
.search-input:focus{
  border-color:var(--accent);background:var(--surface-2);
  box-shadow:0 0 14px var(--accent-glow);
}
.kbd-shortcut{
  position:absolute;left:8px;font-family:var(--font-mono);font-size:9.5px;
  color:var(--faint);background:rgba(255,255,255,0.06);
  padding:2px 5px;border-radius:4px;border:1px solid var(--border);
}

/* دسته‌ها با فونت یکدست فارسی و بدون اسکرول افقی */
.pills-wrap{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
}
.pill{
  cursor:pointer;font-family:var(--font-body);font-size:12px;font-weight:500;
  color:var(--muted);background:var(--surface);
  border:1px solid var(--border);border-radius:14px;
  padding:4px 10px;transition:all 0.2s;display:flex;align-items:center;gap:6px;
}
.pill:hover{color:#FFF;border-color:var(--border-strong);background:var(--surface-2)}
.pill.active{
  background:var(--accent);color:#090A0D;border-color:var(--accent);
  font-weight:700;box-shadow:0 0 12px var(--accent-glow);
}
.pill .badge{font-family:var(--font-body);font-size:10px;font-weight:600;opacity:0.85}

/* ---------- بخش‌های اصلی گالری ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:20px 24px 80px;width:100%}
section{padding-block:18px 10px;scroll-margin-top:140px}
.sec-head{
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:18px;
}
.sec-title-wrap{display:flex;align-items:baseline;gap:10px}
.sec-head h2{font-size:17px;font-weight:700}
.sec-head .latin{
  direction:ltr;font-family:var(--font-mono);font-size:11px;
  color:var(--faint);text-transform:uppercase;letter-spacing:1px;
}
.expand-toggle{
  background:var(--surface);border:1px solid var(--border);color:var(--muted);
  font-family:var(--font-body);font-size:11.5px;cursor:pointer;display:flex;
  align-items:center;gap:6px;transition:all 0.2s;padding:5px 12px;border-radius:8px;
}
.expand-toggle:hover{color:#FFF;border-color:var(--accent);background:var(--surface-2)}
.expand-toggle svg{transition:transform 0.25s}
.expanded .expand-toggle svg{transform:rotate(180deg)}

/* شبکه ۳ تایی و کارت‌های هماهنگ با تم تیره یکپارچه */
.grid{
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
}
figure.card{
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:all 0.25s cubic-bezier(0.16,1,0.3,1);position:relative;
}
figure.card:hover{
  border-color:var(--border-strong);transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,0.5);
}

/* آیتم‌های بیشتر از ۳ در حالت دیفالت پنهان هستند */
figure.card.is-extra{display:none}
.expanded figure.card.is-extra{display:flex}

.preview{
  position:relative;height:230px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center, #161922 0%, #0D0F14 100%);
  border-bottom:1px solid var(--border);overflow:hidden;
}
.preview.h-charts{height:220px}
.preview.h-ind{height:210px}
.preview.h-tog{height:280px}
.preview.h-glass{height:280px}
.preview.h-show{height:300px}
.preview iframe{
  width:100%;height:100%;border:0;display:block;background:transparent;
}

/* پاورقی کارت با فونت فارسی هماهنگ */
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--surface);gap:8px;
}
.card-info{display:flex;flex-direction:column;min-width:0;flex:1}
.card-info .fa{font-family:var(--font-body);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-info .slug{
  direction:ltr;text-align:right;font-family:var(--font-mono);font-size:10px;
  color:var(--faint);margin-top:1px;
}
.card-actions{display:flex;align-items:center;gap:6px}

.btn-icon{
  width:26px;height:26px;border-radius:7px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all 0.2s;text-decoration:none;
}
.btn-icon:hover{color:#FFF;background:var(--surface-hover);border-color:var(--border-strong)}

/* فوتر خلوت */
footer{
  margin-top:auto;border-top:1px solid var(--border);
  background:var(--surface);color:var(--faint);font-size:12px;font-family:var(--font-body);
}
.foot-inner{
  max-width:var(--maxw);margin:0 auto;padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.no-result{
  display:none;color:var(--muted);padding:60px 0;text-align:center;font-size:15px;font-family:var(--font-body);
}

/* توئست */
.copy-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);
  background:#10B981;color:#FFF;padding:8px 16px;border-radius:20px;
  font-family:var(--font-body);font-size:12px;font-weight:600;
  box-shadow:0 8px 24px rgba(16,185,129,0.3);pointer-events:none;opacity:0;
  transition:all 0.3s cubic-bezier(0.16,1,0.3,1);z-index:100;
}
.copy-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="top-bar">
      <div class="brand">
        <div class="logo-icon">UI</div>
        <div class="title-group">
          <h1>گنجینهٔ UI</h1>
          <span class="current-group-badge" id="currentGroup">تمام گروه‌ها</span>
        </div>
      </div>

      <!-- جستجو در سمت چپ هدر روبروی عنوان -->
      <div class="search-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input id="q" type="search" class="search-input" placeholder="جستجو در میان کامپوننت‌ها..." aria-label="جستجو">
        <span class="kbd-shortcut">⌘K</span>
      </div>
    </div>

    <!-- تمام دسته‌ها چندخطی بدون اسکرول افقی با فونت یکدست -->
    <nav class="pills-wrap" id="pills" aria-label="دسته‌بندی"></nav>
  </div>
</header>

<main>
  <div class="no-result" id="no-result">هیچ کامپوننتی مطابق با جستجوی شما یافت نشد.</div>
  <div id="sections"></div>
</main>

<div class="copy-toast" id="toast">مسیر فایل کپی شد!</div>

<footer>
  <div class="foot-inner">
    <span>گنجینهٔ شخصی کامپوننت‌ها و انیمیشن‌های وب</span>
    <span id="summaryCount"></span>
  </div>
</footer>

<script>
// چیدمان منطقی و برتر بر اساس هرم سیستم طراحی (Navigation -> Cards -> Interactions -> Inputs -> Buttons -> Glass -> Charts -> Indicators -> Text -> Transitions -> Scroll -> Backgrounds -> Feedback -> Showcase)
const CATALOG = [
  {cat:"navigation", fa:"ناوبری و منوها", latin:"navigation", h:"", items:[
    {slug:"dropdown-menu", name:"منوی شناور کشویی Shadcn", file:"component.html"},
    {slug:"command-palette", name:"کامند پلت ⌘K", file:"component.html"},
    {slug:"segmented-control", name:"کنترل ناوبری سگمنتی", file:"component.html"},
    {slug:"weekly-calendar", name:"نوار تقویم هفتگی", file:"component.html"},
    {slug:"route-navigation", name:"ناوبری زندهٔ GPS", file:"component.html"},
  ]},
  {cat:"cards", fa:"کارت‌ها و محتوا", latin:"cards", h:"", items:[
    {slug:"auth-card", name:"کارت لاگین شیشه‌ای مدرن", file:"component.html"},
    {slug:"bento-tile", name:"تایل بنتو هوشمند و انیمیشنی", file:"component.html"},
    {slug:"popover-card", name:"کارت پاپ‌اور تعاملی Shadcn", file:"component.html"},
    {slug:"pricing-tier", name:"کارت قیمت‌گذاری حرفه‌ای SaaS", file:"component.html"},
    {slug:"music-player", name:"پلیر موسیقی Now Playing", file:"component.html"},
    {slug:"weather-clock", name:"ساعت جهانی و آب‌وهوا", file:"component.html"},
    {slug:"notification-stack", name:"مرکز اعلان انباشته", file:"component.html"},
  ]},
  {cat:"interactions", fa:"تعاملات و جریان‌ها", latin:"interactions", h:"", items:[
    {slug:"accordion-group", name:"آکاردئون بازشونده تعاملی Shadcn", file:"component.html"},
    {slug:"modal-dialog", name:"پنجره دیالوگ و مودال Shadcn", file:"component.html"},
    {slug:"onboarding-step", name:"ویزارد خوش‌آمدگویی چندمرحله‌ای", file:"component.html"},
    {slug:"task-checklist", name:"چک‌لیست تعاملی", file:"component.html"},
    {slug:"file-upload", name:"پیشرفت آپلود فایل", file:"component.html"},
    {slug:"chat-stream", name:"جریان چت زنده", file:"component.html"},
    {slug:"kanban-board", name:"برد کانبان اسپرینت", file:"component.html"},
  ]},
  {cat:"inputs", fa:"ورودی‌ها و فرم‌ها", latin:"inputs", h:"", items:[
    {slug:"otp-verification", name:"تأیید کد ۶ رقمی OTP", file:"component.html"},
    {slug:"volume-brightness-sliders", name:"اسلایدر صدا و روشنایی", file:"component.html"},
    {slug:"color-picker", name:"انتخابگر رنگ HSL", file:"component.html"},
  ]},
  {cat:"buttons", fa:"دکمه‌ها", latin:"buttons", h:"", items:[
    {slug:"deploy-button", name:"دکمهٔ دیپلوی مورف‌شونده", file:"component.html"},
    {slug:"social-heart-like", name:"دکمهٔ لایک قلب", file:"component.html"},
  ]},
  {cat:"toggles", fa:"سوییچ‌ها و تم", latin:"toggles", h:"h-tog", items:[
    {slug:"day-night-switch", name:"سوییچ شب و روز انیمیشنی", file:"demo.html"},
    {slug:"pricing-toggle", name:"سوییچ پلن قیمت", file:"component.html"},
  ]},
  {cat:"glass", fa:"شیشهٔ مایع WebGL", latin:"liquid glass", h:"h-glass", items:[
    {slug:"press-button", name:"دکمهٔ شیشه‌ای — Press", file:"demo.html"},
    {slug:"merge-action-button", name:"دکمهٔ اقدام ذوب‌شونده — Merge", file:"demo.html"},
    {slug:"hold-card", name:"کارت شیشه‌ای — Hold", file:"demo.html"},
    {slug:"share-button-group", name:"گروه دکمه — Share", file:"demo.html"},
    {slug:"flow-badge", name:"نشان شیشه‌ای — Flow", file:"demo.html"},
  ]},
  {cat:"charts", fa:"نمودارهای تحلیلی", latin:"charts", h:"h-charts", items:[
    {slug:"candlestick", name:"کندل‌استیک بازارهای مالی", file:"component.html"},
    {slug:"portfolio-donut", name:"دونات سبد دارایی", file:"component.html"},
    {slug:"fear-greed", name:"شاخص عقربه‌ای ترس و طمع", file:"component.html"},
    {slug:"credit-score", name:"امتیاز اعتباری قوسی", file:"component.html"},
    {slug:"activity-heatmap", name:"هیت‌مپ فعالیت تقویمی", file:"component.html"},
    {slug:"market-depth", name:"عمق بازار تعاملی", file:"component.html"},
    {slug:"gradient-line", name:"خط گرادیانی پویا", file:"component.html"},
    {slug:"dominance-rings", name:"حلقه‌های سهم بازار", file:"component.html"},
    {slug:"stock-portfolio", name:"اسپارک‌لاین عملکرد پرتفوی", file:"component.html"},
  ]},
  {cat:"indicators", fa:"گیج‌ها و پیشرفت", latin:"indicators", h:"h-ind", items:[
    {slug:"multi-arc-percent", name:"گیج درصدی سه‌قوسی", file:"component.html"},
    {slug:"block-ring", name:"حلقهٔ بلوکی درصد", file:"component.html"},
    {slug:"radial-bar-percent", name:"نوار پیشرفت شعاعی", file:"component.html"},
    {slug:"chunk-percent", name:"گیج درصدی تکه‌ای", file:"component.html"},
    {slug:"streak-tracker", name:"ردیاب استریک روزانه", file:"component.html"},
    {slug:"collaborator-presence", name:"حضور زندهٔ همکاران", file:"component.html"},
    {slug:"activity-rings", name:"حلقه‌های پیشرفت", file:"component.html"},
    {slug:"countdown-timer", name:"تایمر تمرکز (پومودورو)", file:"component.html"},
    {slug:"battery-monitor", name:"مانیتور باتری چنددستگاهی", file:"component.html"},
  ]},
  {cat:"text", fa:"انیمیشن‌های متن", latin:"typography", h:"", items:[
    {slug:"typewriter-reveal", name:"تایپ ماشین‌نویسی پویا", file:"component.html"},
    {slug:"gradient-shimmer", name:"درخشش گرادیانی متن", file:"component.html"},
    {slug:"staggered-wave", name:"موج متحرک حروف", file:"component.html"},
  ]},
  {cat:"transitions", fa:"ترانزیشن و ورود", latin:"transitions", h:"", items:[
    {slug:"staggered-entrance", name:"ورود متوالی لیست", file:"component.html"},
    {slug:"flip-card-switch", name:"چرخش ۳بعدی تغییر نما", file:"component.html"},
    {slug:"elastic-scale", name:"تغییر شکل الاستیک مورفینگ", file:"component.html"},
  ]},
  {cat:"scroll", fa:"انیمیشن‌های اسکرول", latin:"scroll motion", h:"", items:[
    {slug:"parallax-layers", name:"لایه‌های پارالاکس چندعمقی", file:"component.html"},
    {slug:"scroll-reveal", name:"آشکارسازی پیوسته ویوپورت", file:"component.html"},
  ]},
  {cat:"backgrounds", fa:"افکت‌های پس‌زمینه", latin:"backgrounds", h:"", items:[
    {slug:"particle-constellation", name:"صورت فلکی ذرات تعاملی", file:"component.html"},
    {slug:"synthwave-grid", name:"افق شبکهٔ سینت‌ویو Retro", file:"component.html"},
    {slug:"dynamic-grid", name:"شبکهٔ نقطه‌ای نوسانی", file:"component.html"},
  ]},
  {cat:"feedback", fa:"بازخورد و وضعیت", latin:"feedback", h:"", items:[
    {slug:"skeleton-loader", name:"اسکلتون لودر درخشان", file:"component.html"},
    {slug:"toast-notification", name:"توئست اعلان شناور", file:"component.html"},
  ]},
  {cat:"showcase", fa:"ویترین کامل محصول", latin:"showcase", h:"h-show", items:[
    {slug:"cake-couch", name:"Cake Couch — نمایش محصول انیمیشنی", file:"index.html", note:"برای بارگذاری art.svg به سرور محلی نیاز دارد"},
  ]},
];

const faNum = n => n.toLocaleString("fa-IR");
const toast = document.getElementById("toast");
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

const totalItems = CATALOG.reduce((a, c) => a + c.items.length, 0);
document.getElementById("summaryCount").textContent = `${faNum(totalItems)} کامپوننت در ${faNum(CATALOG.length)} گروه کارکردی`;

// رندر پیل‌های ناوبری با فونت فارسی هماهنگ
const pills = document.getElementById("pills");
for (const c of CATALOG) {
  const b = document.createElement("button");
  b.className = "pill";
  b.id = "pill-" + c.cat;
  b.textContent = c.fa;
  const n = document.createElement("span");
  n.className = "badge"; n.textContent = faNum(c.items.length);
  b.append(n);
  b.addEventListener("click", () => {
    document.getElementById(c.cat).scrollIntoView({behavior:"smooth"});
  });
  pills.append(b);
}

// ساخت سکشن‌ها با نمایش پیش‌فرض ۳ تایی
const wrap = document.getElementById("sections");

function toggleGroupExpand(sec){
  const isExp = sec.classList.toggle("expanded");
  const btn = sec.querySelector(".expand-toggle span");
  const extraCount = sec.querySelectorAll(".card.is-extra").length;
  if(btn){
    btn.textContent = isExp ? "بستن موارد دیگر" : `مشاهده موارد دیگر (+${faNum(extraCount)})`;
  }
}

for (const c of CATALOG) {
  const sec = document.createElement("section");
  sec.id = c.cat;
  sec.dataset.groupName = c.fa;
  
  const head = document.createElement("div");
  head.className = "sec-head";
  const titleWrap = document.createElement("div");
  titleWrap.className = "sec-title-wrap";
  const h2 = document.createElement("h2"); h2.textContent = c.fa;
  const latin = document.createElement("span"); latin.className = "latin"; latin.textContent = c.latin;
  titleWrap.append(h2, latin);

  head.append(titleWrap);

  const extraCount = c.items.length - 3;
  if (extraCount > 0) {
    const expandBtn = document.createElement("button");
    expandBtn.className = "expand-toggle";
    expandBtn.innerHTML = `<span>مشاهده موارد دیگر (+${faNum(extraCount)})</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>`;
    expandBtn.addEventListener("click", () => toggleGroupExpand(sec));
    head.append(expandBtn);
  }

  const grid = document.createElement("div"); grid.className = "grid";
  c.items.forEach((it, idx) => {
    const filePath = `${c.cat}/${it.slug}/${it.file}`;
    const fig = document.createElement("figure");
    // ۳ آیتم اول همیشه باز، مابقی با کلیک دکمه
    fig.className = "card" + (idx >= 3 ? " is-extra" : "");
    fig.dataset.fa = it.name;
    fig.dataset.slug = it.slug;

    const pv = document.createElement("div");
    pv.className = "preview " + (c.h || "");
    const fr = document.createElement("iframe");
    fr.loading = "lazy";
    fr.title = it.name;
    fr.setAttribute("referrerpolicy", "no-referrer");
    fr.dataset.src = filePath;
    pv.append(fr);

    const footer = document.createElement("div");
    footer.className = "card-footer";

    const info = document.createElement("div");
    info.className = "card-info";
    const name = document.createElement("span"); name.className = "fa"; name.textContent = it.name;
    const slug = document.createElement("span"); slug.className = "slug"; slug.textContent = it.slug;
    info.append(name, slug);

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const copyBtn = document.createElement("button");
    copyBtn.className = "btn-icon";
    copyBtn.title = "کپی مسیر فایل";
    copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    copyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(filePath);
      showToast("مسیر فایل کپی شد: " + filePath);
    });

    const openLink = document.createElement("a");
    openLink.className = "btn-icon";
    openLink.href = filePath;
    openLink.target = "_blank";
    openLink.title = "مشاهده تمام‌صفحه";
    openLink.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

    actions.append(copyBtn, openLink);
    footer.append(info, actions);
    fig.append(pv, footer);
    grid.append(fig);
  });

  sec.append(head, grid);
  wrap.append(sec);
}

// بارگذاری تنبل
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting) {
      const fr = e.target;
      if (!fr.src) fr.src = fr.dataset.src;
      io.unobserve(fr);
    }
  }
}, {rootMargin: "400px"});
document.querySelectorAll("iframe[data-src]").forEach(fr => io.observe(fr));

// اسکرول‌اسپای هوشمند
const currentGroupBadge = document.getElementById("currentGroup");
const sections = document.querySelectorAll("section[id]");

window.addEventListener("scroll", () => {
  let activeSec = null;
  const scrollY = window.scrollY + 200;

  for (const sec of sections) {
    if (sec.offsetTop <= scrollY && (sec.offsetTop + sec.offsetHeight) > scrollY) {
      activeSec = sec;
      break;
    }
  }

  if (activeSec) {
    currentGroupBadge.textContent = activeSec.dataset.groupName;
    document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
    const activePill = document.getElementById("pill-" + activeSec.id);
    if (activePill) activePill.classList.add("active");
  } else if (window.scrollY < 120) {
    currentGroupBadge.textContent = "تمام گروه‌ها";
    document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  }
}, {passive:true});

// جستجوی لحظه‌ای
const q = document.getElementById("q");
const noResult = document.getElementById("no-result");

q.addEventListener("input", () => {
  const t = q.value.trim().toLowerCase();
  let visible = 0;
  
  if (t) {
    document.querySelectorAll("section").forEach(sec => sec.classList.add("expanded"));
  } else {
    document.querySelectorAll("section").forEach(sec => sec.classList.remove("expanded"));
  }

  for (const sec of wrap.querySelectorAll("section")) {
    let secVisible = 0;
    for (const card of sec.querySelectorAll(".card")) {
      const hit = !t
        || card.dataset.fa.toLowerCase().includes(t)
        || card.dataset.slug.toLowerCase().includes(t);
      card.style.display = hit ? "" : "none";
      if (hit) { secVisible++; visible++; }
    }
    sec.style.display = secVisible ? "" : "none";
  }
  noResult.style.display = visible ? "none" : "block";
});

// میانبر ⌘K
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    q.focus();
    q.select();
  }
});
</script>
