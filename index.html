<style>
:root{
  --bg:#090A0D;
  --surface:#111318;
  --surface-2:#171A21;
  --surface-hover:#1D212A;
  --fg:#F1F4F9;
  --muted:#94A3B8;
  --faint:#64748B;
  --border:rgba(255,255,255,0.07);
  --border-strong:rgba(255,255,255,0.16);
  --accent:#38BDF8;
  --accent-glow:rgba(56,189,248,0.25);
  --font-body:"Vazirmatn","Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --radius:16px;
  --maxw:1320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--font-body);font-size:14px;line-height:1.6;
  min-height:100vh;display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}

/* ---------- هدر شیشه‌ای مدرن ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(9,10,13,0.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.head-inner{
  max-width:var(--maxw);margin:0 auto;
  padding:16px 24px 10px;display:flex;flex-direction:column;gap:14px;
}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:12px}
.logo-icon{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg, #38BDF8, #818CF8);
  display:flex;align-items:center;justify-content:center;
  color:#090A0D;font-weight:800;font-size:15px;box-shadow:0 0 20px rgba(56,189,248,0.4);
}
h1{
  font-size:20px;font-weight:800;letter-spacing:-0.4px;
  display:flex;align-items:center;gap:8px;
}
h1 .count{
  font-family:var(--font-mono);font-size:12px;font-weight:600;
  color:var(--accent);background:rgba(56,189,248,0.12);
  padding:2px 8px;border-radius:20px;border:1px solid rgba(56,189,248,0.25);
}
.ext-links{display:flex;align-items:center;gap:12px}
.github-link{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);
  padding:6px 12px;border-radius:8px;border:1px solid var(--border);
  transition:all 0.2s;background:var(--surface);
}
.github-link:hover{color:#FFF;border-color:var(--border-strong);background:var(--surface-2)}

/* ابزارهای سرچ و فیلتر */
.tools{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.search-box{
  position:relative;display:flex;align-items:center;flex:1 1 260px;max-width:380px;
}
.search-icon{
  position:absolute;right:12px;color:var(--faint);pointer-events:none;
}
.search-input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:9px 36px 9px 48px;
  font-family:var(--font-body);font-size:13px;color:var(--fg);
  outline:none;transition:all 0.2s;
}
.search-input:focus{
  border-color:var(--accent);background:var(--surface-2);
  box-shadow:0 0 16px var(--accent-glow);
}
.kbd-shortcut{
  position:absolute;left:10px;font-family:var(--font-mono);font-size:10px;
  color:var(--faint);background:rgba(255,255,255,0.06);
  padding:2px 6px;border-radius:6px;border:1px solid var(--border);
}
.pills-scroll{
  display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:6px;
  scrollbar-width:none;-ms-overflow-style:none;flex:1 1 100%;
}
.pills-scroll::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;cursor:pointer;font-size:12px;font-weight:500;
  color:var(--muted);background:var(--surface);
  border:1px solid var(--border);border-radius:20px;
  padding:5px 12px;transition:all 0.2s;display:flex;align-items:center;gap:6px;
}
.pill:hover{color:#FFF;border-color:var(--border-strong);background:var(--surface-2)}
.pill.active{
  background:var(--accent);color:#090A0D;border-color:var(--accent);
  font-weight:700;box-shadow:0 0 14px var(--accent-glow);
}
.pill .badge{
  font-family:var(--font-mono);font-size:10px;opacity:0.8;
}

/* ---------- محتوای اصلی ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:24px 24px 80px;width:100%}
section{padding-block:16px 8px;scroll-margin-top:140px}
.sec-head{
  display:flex;align-items:baseline;gap:12px;
  border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:20px;
}
.sec-head h2{font-size:18px;font-weight:700;letter-spacing:-0.2px}
.sec-head .latin{
  direction:ltr;font-family:var(--font-mono);font-size:11px;
  color:var(--faint);text-transform:uppercase;letter-spacing:1px;
}
.sec-head .c{
  font-family:var(--font-mono);font-size:11px;color:var(--muted);
  margin-inline-start:auto;background:var(--surface-2);padding:2px 8px;border-radius:12px;
}

/* شبکه کارت‌ها */
.grid{
  display:grid;gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
}
figure.card{
  display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;transition:all 0.25s cubic-bezier(0.16,1,0.3,1);position:relative;
}
figure.card:hover{
  border-color:var(--border-strong);transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,0.5);
}
.preview{
  position:relative;height:230px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at center, #171A21 0%, #0F1116 100%);
  border-bottom:1px solid var(--border);overflow:hidden;
}
.preview.h-charts{height:220px}
.preview.h-ind{height:210px}
.preview.h-tog{height:280px}
.preview.h-glass{height:280px}
.preview.h-show{height:300px}
.preview iframe{
  width:100%;height:100%;border:0;display:block;background:transparent;
}

/* پاورقی و دکمه‌های کارت */
.card-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--surface);gap:8px;
}
.card-info{display:flex;flex-direction:column;min-width:0;flex:1}
.card-info .fa{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-info .slug{
  direction:ltr;text-align:right;font-family:var(--font-mono);font-size:10px;
  color:var(--faint);margin-top:1px;
}
.card-actions{display:flex;align-items:center;gap:6px}
.src-tag{
  font-size:10px;font-family:var(--font-mono);padding:2px 8px;border-radius:6px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
}
.src-tag.tag-Quix{color:#38BDF8;border-color:rgba(56,189,248,0.2)}
.src-tag.tag-d3motion{color:#818CF8;border-color:rgba(129,140,248,0.2)}
.src-tag.tag-LiquidGlass{color:#34D399;border-color:rgba(52,211,153,0.2)}
.src-tag.tag-Handbook{color:#F472B6;border-color:rgba(244,114,182,0.2)}
.src-tag.tag-VibePrompt{color:#FBBF24;border-color:rgba(251,191,36,0.2)}

.btn-icon{
  width:28px;height:28px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all 0.2s;text-decoration:none;
}
.btn-icon:hover{color:#FFF;background:var(--surface-hover);border-color:var(--border-strong)}

/* فوتر */
footer{
  margin-top:auto;border-top:1px solid var(--border);
  background:var(--surface);color:var(--faint);font-size:12px;
}
.foot-inner{
  max-width:var(--maxw);margin:0 auto;padding:24px;
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;
}
.foot-inner a{color:var(--muted);text-decoration:underline}
.no-result{
  display:none;color:var(--muted);padding:60px 0;text-align:center;font-size:15px;
}

/* توئست کپی */
.copy-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);
  background:#10B981;color:#FFF;padding:8px 16px;border-radius:20px;
  font-size:12px;font-weight:600;box-shadow:0 8px 24px rgba(16,185,129,0.3);
  pointer-events:none;opacity:0;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);z-index:100;
}
.copy-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>

  {cat:"scroll", fa:"انیمیشن‌های اسکرول", latin:"scroll motion", h:"", items:[
    {slug:"parallax-layers", name:"لایه‌های پارالاکس چندعمقی", src:"Handbook", file:"component.html"},
    {slug:"scroll-reveal", name:"آشکارسازی پیوسته ویوپورت", src:"Handbook", file:"component.html"},
  ]},
  {cat:"feedback", fa:"بازخورد و وضعیت", latin:"feedback", h:"", items:[
    {slug:"skeleton-loader", name:"اسکلتون لودر درخشان", src:"Handbook", file:"component.html"},
    {slug:"toast-notification", name:"توئست اعلان شناور", src:"Handbook", file:"component.html"},
  ]},
];

const faNum = n => n.toLocaleString("fa-IR");
const toast = document.getElementById("toast");
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2000);
}

// مقداردهی سرصفحه
const total = CATALOG.reduce((a, c) => a + c.items.length, 0);
document.getElementById("total").textContent = faNum(total) + " آیتم زنده";

const pills = document.getElementById("pills");
for (const c of CATALOG) {
  const b = document.createElement("button");
  b.className = "pill";
  b.textContent = c.fa;
  const n = document.createElement("span");
  n.className = "badge"; n.textContent = faNum(c.items.length);
  b.append(n);
  b.addEventListener("click", () => {
    document.querySelectorAll(".pill.active").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    document.getElementById(c.cat).scrollIntoView({behavior:"smooth"});
  });
  pills.append(b);
}
pills.firstElementChild.classList.add("active");

// رندر کارت‌ها
const wrap = document.getElementById("sections");
for (const c of CATALOG) {
  const sec = document.createElement("section");
  sec.id = c.cat;
  
  const head = document.createElement("div");
  head.className = "sec-head";
  const h2 = document.createElement("h2"); h2.textContent = c.fa;
  const latin = document.createElement("span"); latin.className = "latin"; latin.textContent = c.latin;
  const cnt = document.createElement("span"); cnt.className = "c"; cnt.textContent = faNum(c.items.length);
  head.append(h2, latin, cnt);

  const grid = document.createElement("div"); grid.className = "grid";
  for (const it of c.items) {
    const filePath = `${c.cat}/${it.slug}/${it.file}`;
    const fig = document.createElement("figure");
    fig.className = "card";
    fig.dataset.fa = it.name;
    fig.dataset.slug = it.slug;

    const pv = document.createElement("div");
    pv.className = "preview " + (c.h || "");
    const fr = document.createElement("iframe");
    fr.loading = "lazy";
    fr.title = it.name;
    fr.setAttribute("referrerpolicy", "no-referrer");
    fr.dataset.src = filePath;
    pv.append(fr);

    const footer = document.createElement("div");
    footer.className = "card-footer";

    const info = document.createElement("div");
    info.className = "card-info";
    const name = document.createElement("span"); name.className = "fa"; name.textContent = it.name;
    const slug = document.createElement("span"); slug.className = "slug"; slug.textContent = it.slug;
    info.append(name, slug);

    const actions = document.createElement("div");
    actions.className = "card-actions";

    const srcTag = document.createElement("span");
    srcTag.className = `src-tag tag-${it.src.replace(/\s+/g,'')}`;
    srcTag.textContent = it.src;

    const copyBtn = document.createElement("button");
    copyBtn.className = "btn-icon";
    copyBtn.title = "کپی مسیر فایل";
    copyBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(filePath);
      showToast("مسیر فایل کپی شد: " + filePath);
    });

    const openLink = document.createElement("a");
    openLink.className = "btn-icon";
    openLink.href = filePath;
    openLink.target = "_blank";
    openLink.title = "مشاهده تمام‌صفحه در تب جدید";
    openLink.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;

    actions.append(srcTag, copyBtn, openLink);
    footer.append(info, actions);
    fig.append(pv, footer);
    grid.append(fig);
  }

  sec.append(head, grid);
  wrap.append(sec);
}

// بارگذاری تنبل iframe
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting) {
      const fr = e.target;
      if (!fr.src) fr.src = fr.dataset.src;
      io.unobserve(fr);
    }
  }
}, {rootMargin: "400px"});
document.querySelectorAll("iframe[data-src]").forEach(fr => io.observe(fr));

// جستجوی بلادرنگ
const q = document.getElementById("q");
const noResult = document.getElementById("no-result");
q.addEventListener("input", () => {
  const t = q.value.trim().toLowerCase();
  let visible = 0;
  for (const sec of wrap.querySelectorAll("section")) {
    let secVisible = 0;
    for (const card of sec.querySelectorAll(".card")) {
      const hit = !t
        || card.dataset.fa.toLowerCase().includes(t)
        || card.dataset.slug.toLowerCase().includes(t);
      card.style.display = hit ? "" : "none";
      if (hit) { secVisible++; visible++; }
    }
    sec.style.display = secVisible ? "" : "none";
  }
  noResult.style.display = visible ? "none" : "block";
});

// کلید میانبر جستجو (Ctrl+K یا ⌘K)
window.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    q.focus();
    q.select();
  }
});
</script>
</body>
</html>
