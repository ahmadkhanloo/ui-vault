<lp-chart type="activity-heatmap"></lp-chart>
<script>
(function () {
const FONT = '"DM Sans",-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif';
const W = 320, H = 200, PAD = 18;
const TXT = "#FAFCFB", SUB = "#B4BDBA", MUT = "#7D8A86", DIM = "#4A5250", GRID = "rgba(255,255,255,0.07)", TRACK = "#1C1F1E", CARD = "#0E0F0F";

const hexCache = {};
function hex(c) {

const TAU = Math.PI * 2;
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - k, 3);
const fmt = (v, d = 0) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });

// seeded random + smooth periodic noise (f(u) repeats every 1), used for all chart data so every card is stable
function rng(s) { let a = s >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function wave(seed, K = 7, r = 0.9) { const R = rng(seed), c = []; for (let k = 1; k <= K; k++) c.push([Math.pow(k, -r) * (0.6 + 0.8 * R()), R() * TAU]); return u => c.reduce((s, [a, p], i) => s + a * Math.sin(TAU * (i + 1) * u + p), 0); }
// n values in 0..1 (span = how much of one period is used, trend = added slope before normalising, shift = scroll offset)
function ser(seed, n, o = {}) {
  const f = wave(seed, o.K || 7, o.r == null ? 0.9 : o.r), sp = o.span || 0.6, v = [];
  for (let i = 0; i < n; i++) v.push(f(i / (n - 1) * sp + (o.shift || 0)) + (o.trend || 0) * i / (n - 1));

}
const pts = (v, X0, Y0, X1, Y1) => v.map((k, i) => [X0 + (X1 - X0) * i / (v.length - 1), Y1 - (Y1 - Y0) * k]);

  const ls = "letterSpacing" in x; if (ls) x.letterSpacing = (o.ls || 0) + "px";
  x.fillText(s, X, Y); const m = x.measureText(s).width; if (ls) x.letterSpacing = "0px"; return m;
}
const tw = (x, s, sz, w = 500) => { x.font = `${w} ${sz}px ${FONT}`; return x.measureText(s).width; };
function RR(x, X, Y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }

function curve(x, P, sm = 1, move = true) {

function dot(x, X, Y, r, col) { x.beginPath(); x.arc(X, Y, r, 0, TAU); x.fillStyle = col; x.fill(); }
function hl(x, X0, X1, Y, col = GRID, dash, lw = 1) { x.save(); x.beginPath(); x.moveTo(X0, Y); x.lineTo(X1, Y); x.strokeStyle = col; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.stroke(); x.restore(); }
function vl(x, X, Y0, Y1, col = GRID, dash, lw = 1) { x.save(); x.beginPath(); x.moveTo(X, Y0); x.lineTo(X, Y1); x.strokeStyle = col; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.stroke(); x.restore(); }

function pulse(x, X, Y, col, k, r = 3.5) { dot(x, X, Y, r + 10 * k, rgba(col, 0.35 * (1 - k))); dot(x, X, Y, r + 2, rgba(col, 0.3)); dot(x, X, Y, r, col); }
// pill chip; al "r" anchors at its right edge. Returns width.
function chip(x, s, X, Y, col, o = {}) {
  const sz = o.s || 10, w = tw(x, s, sz, o.w || 600) + (o.px || 8) * 2, h = o.h || 18, X0 = o.al === "r" ? X - w : o.al === "c" ? X - w / 2 : X;

}
function tri(x, X, Y, s, col, up = true) { x.beginPath(); if (up) { x.moveTo(X, Y - s * 0.6); x.lineTo(X + s * 0.6, Y + s * 0.4); x.lineTo(X - s * 0.6, Y + s * 0.4); } else { x.moveTo(X, Y + s * 0.6); x.lineTo(X + s * 0.6, Y - s * 0.4); x.lineTo(X - s * 0.6, Y - s * 0.4); } x.closePath(); x.fillStyle = col; x.fill(); }
// coin badge with a letter
function coin(x, X, Y, r, sym, col) { dot(x, X, Y, r, col); T(x, sym, X, Y + 0.5, { s: r * 1.15, w: 700, c: "#fff", al: "center", bl: "middle" }); }
// small icon glyphs drawn with lines (bars, filter, dots, arrow, heart, bolt, gear)
function icon(x, k, X, Y, col = SUB, s = 14) {
  x.save(); x.translate(X, Y); x.scale(s / 24, s / 24); x.strokeStyle = col; x.fillStyle = col; x.lineWidth = 2.2; x.lineCap = "round"; x.lineJoin = "round"; x.beginPath();
  if (k === "bars") { x.moveTo(6, 20); x.lineTo(6, 12); x.moveTo(12, 20); x.lineTo(12, 5); x.moveTo(18, 20); x.lineTo(18, 9); x.stroke(); }
  else if (k === "filter") { x.moveTo(4, 7); x.lineTo(20, 7); x.moveTo(7, 12); x.lineTo(17, 12); x.moveTo(10, 17); x.lineTo(14, 17); x.stroke(); }
  else if (k === "more") { [6, 12, 18].forEach(v => { x.moveTo(12 + 1.8, v); x.arc(12, v, 1.8, 0, TAU); }); x.fill(); }
  else if (k === "share") { [[18, 5], [6, 12], [18, 19]].forEach(([a, b]) => { x.moveTo(a + 2.6, b); x.arc(a, b, 2.6, 0, TAU); }); x.moveTo(8.3, 10.8); x.lineTo(15.7, 6.2); x.moveTo(8.3, 13.2); x.lineTo(15.7, 17.8); x.stroke(); }
  else if (k === "heart") { x.moveTo(12, 20); x.bezierCurveTo(2, 13, 3, 4, 9, 5); x.bezierCurveTo(10.5, 5.3, 11.5, 6.5, 12, 7.5); x.bezierCurveTo(12.5, 6.5, 13.5, 5.3, 15, 5); x.bezierCurveTo(21, 4, 22, 13, 12, 20); x.stroke(); }
  else if (k === "bolt") { x.moveTo(13.5, 2); x.lineTo(4.5, 13.5); x.lineTo(11, 13.5); x.lineTo(10, 22); x.lineTo(19, 10.5); x.lineTo(12.5, 10.5); x.closePath(); x.fill(); }
  else if (k === "gear") { x.arc(12, 12, 3.2, 0, TAU); x.moveTo(12 + 8, 12); x.arc(12, 12, 8, 0, TAU); x.stroke(); }
  else if (k === "eye") { x.moveTo(2, 12); x.quadraticCurveTo(12, 1, 22, 12); x.quadraticCurveTo(12, 23, 2, 12); x.moveTo(15, 12); x.arc(12, 12, 3, 0, TAU); x.stroke(); }
  else if (k === "chart") { x.moveTo(3, 18); x.lineTo(9, 11); x.lineTo(13, 15); x.lineTo(21, 6); x.stroke(); }
  else if (k === "dollar") { x.moveTo(12, 2.5); x.lineTo(12, 21.5); x.moveTo(17, 6.5); x.bezierCurveTo(15, 4, 7, 4, 7, 8.5); x.bezierCurveTo(7, 13, 17, 11, 17, 15.5); x.bezierCurveTo(17, 20, 9, 20, 6.5, 17.5); x.stroke(); }
  x.restore();
}
// title at top-left (+ optional sub line)
function hd(x, title, sub) { T(x, title, PAD, 30, { s: 13, w: 600 }); if (sub) T(x, sub, PAD, 46, { s: 10.5, c: MUT }); }
// small caps label like the watch widgets
const cap = (x, s, X, Y, col = MUT, al = "left", sz = 9.5) => T(x, s, X, Y, { s: sz, w: 600, c: col, al, ls: 0.6 });
// big number with a small unit right after it
function big(x, v, X, Y, unit, o = {}) { const w = T(x, v, X, Y, { s: o.s || 26, w: 700, c: o.c || TXT, ls: -0.5 }); if (unit) T(x, unit, X + w + 3, Y, { s: o.us || 11, w: 600, c: o.uc || MUT }); return w; }

function stadium(x, X, Y, w, h, r) {
  x.beginPath(); x.moveTo(X + w / 2, Y); x.lineTo(X + w - r, Y); x.arc(X + w - r, Y + r, r, -Math.PI / 2, 0); x.lineTo(X + w, Y + h - r); x.arc(X + w - r, Y + h - r, r, 0, Math.PI / 2);
  x.lineTo(X + r, Y + h); x.arc(X + r, Y + h - r, r, Math.PI / 2, Math.PI); x.lineTo(X, Y + r); x.arc(X + r, Y + r, r, Math.PI, Math.PI * 1.5); x.lineTo(X + w / 2, Y);

// Every chart: c = default main color, d(g) draws one frame. g = {x: canvas ctx, t: seconds, c: main color,
// a(delay, len) = intro progress 0..1, w(k, phase) = live sine that loops every 4s, f(k) = 0..1 sawtooth that loops every 4s}
const C = {
  "activity-heatmap": { c: TEAL, d(g) {
    const { x, c } = g; hd(x, "Trading Activity", "Trades per day"); chip(x, "2026", W - PAD, 28, c, { al: "r" });
    const R = rng(201), cols = 21, sz = 10.4, gap = 2.8, X0 = PAD, Y0 = 72;
    ["Jun", "Jul", "Aug", "Sep", "Oct"].forEach((s, i) => T(x, s, X0 + i * 4.3 * (sz + gap), 64, { s: 9.5, c: MUT }));
    for (let i = 0; i < cols; i++) for (let j = 0; j < 7; j++) {
      const v = R(), p = g.a(0.05 + i * 0.03, 0.5), hw = 0.5 + 0.5 * Math.cos(TAU * (i / cols - g.f(1))), lv = v < 0.25 ? 0 : v < 0.5 ? 1 : v < 0.75 ? 2 : 3;
      fRR(x, X0 + i * (sz + gap), Y0 + j * (sz + gap), sz, sz, 2.5, lv === 0 ? TRACK : rgba(c, (0.25 + lv * 0.25) * p * (g.t > 1.3 ? 0.8 + 0.2 * hw : 1)));
    }
    T(x, "1,284 trades", PAD, 186, { s: 10.5, w: 600, c: SUB });
    T(x, "Less", 190, 186, { s: 9.5, c: MUT }); [0, 1, 2, 3].forEach(l => fRR(x, 216 + l * 13, 177, 10, 10, 2.5, l ? rgba(c, 0.25 + l * 0.25) : TRACK)); T(x, "More", W - PAD, 186, { s: 9.5, c: MUT, al: "right" });
  } },
};
// shared registry, so several standalone snippets on one page can each add their own charts
const REG = window.__lpChartReg = Object.assign(window.__lpChartReg || {}, C);
// mix two colors (k 0..1)
function mix(a, b, k) { const A = parseInt(hex(a).slice(1), 16), B = parseInt(hex(b).slice(1), 16), m = s => Math.round(((A >> s) & 255) * (1 - k) + ((B >> s) & 255) * k); return `rgb(${m(16)},${m(8)},${m(0)})`; }

})();
</script>
